name: GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tag and package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${PACKAGE_VERSION}." >&2
            exit 1
          }
      - name: Run release checks
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev]"
          python -m compileall -q src tests scripts
          pytest -q
          python -m build
          python -m twine check dist/*
      - name: Generate checksums
        shell: bash
        run: sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            RELEASE_NOTES_v0.2.1.md \
            --title "MathDraw Studio ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES_v0.2.1.md \
            --verify-tag
